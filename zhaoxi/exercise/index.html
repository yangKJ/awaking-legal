<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#fff8f1" />
  <title>照惜 Pro 体验计划 · 选择语言</title>
  <link rel="icon" type="image/png" href="../assets/app-icon.png" />
  <link rel="stylesheet" href="./activity.css" />
  <script>
    (function () {
      var language = (navigator.language || "en").toLowerCase();
      var path = language.indexOf("zh-hant") === 0 || language.indexOf("zh-tw") === 0 || language.indexOf("zh-hk") === 0 || language.indexOf("zh-mo") === 0
        ? "./zh-hant/"
        : language.indexOf("zh") === 0 ? "./zh/" : "./en/";
      window.location.replace(path);
    }());
  </script>
</head>
<body class="language-page">
  <main class="language-card">
    <img src="../assets/app-icon.png" alt="照惜 App 图标" width="72" height="72" />
    <h1>照惜 Pro 体验计划</h1>
    <p>请选择语言 · Choose a language</p>
    <nav aria-label="选择活动页语言">
      <a href="./zh/">简体中文</a>
      <a href="./zh-hant/">繁體中文</a>
      <a href="./en/" lang="en">English</a>
    </nav>
  </main>
</body>
</html>
